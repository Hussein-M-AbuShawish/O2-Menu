      :root {
        --brand-color: #e20004;
        --dark-bg: #0a0a0a;
        --card-bg: #1a1a1a;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --shadow: rgba(226, 0, 4, 0.3);
        --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        overflow-x: hidden;
        width: 100%;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a1a 100%);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
      }

      header {
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: clamp(0.75rem, 2vw, 1rem) 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(226, 0, 4, 0.2);
        width: 100%;
      }

      .header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 clamp(10px, 3vw, 15px);
        width: 100%;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        text-align: center;
      }
      .logo-red {
        color: var(--brand-color);
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 800;
      }
      .logo-red sub {
        font-size: 1.2rem;
        font-weight: 800;
      }

      .burger-menu {
        display: flex;
        align-items: center;
        gap: clamp(4px, 2vw, 8px);
        cursor: pointer;
        z-index: 1001;
        padding: clamp(6px, 2vw, 8px) clamp(8px, 2.5vw, 12px);
        border-radius: 8px;
        transition: var(--transition);
      }

      .burger-menu:hover {
        background: rgba(226, 0, 4, 0.1);
      }

      .burger-icon {
        width: clamp(20px, 5vw, 24px);
        height: clamp(15px, 4vw, 18px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .burger-line {
        width: 100%;
        height: 3px;
        background: var(--brand-color);
        border-radius: 3px;
        transition: var(--transition);
      }

      .burger-text {
        color: var(--brand-color);
        font-weight: 600;
        font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      }

      .burger-menu.active .burger-line:nth-child(1) {
        transform: translateY(7.5px) rotate(45deg);
      }
      .burger-menu.active .burger-line:nth-child(2) {
        opacity: 0;
      }
      .burger-menu.active .burger-line:nth-child(3) {
        transform: translateY(-7.5px) rotate(-45deg);
      }

      .nav-sidebar {
        position: fixed;
        right: -100%;
        top: 0;
        width: min(280px, 85vw);
        height: 100vh;
        background: var(--card-bg);
        z-index: 1000;
        transition: var(--transition);
        padding: clamp(70px, 15vh, 80px) 15px 20px;
        box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .nav-sidebar.active {
        right: 0;
      }
      .nav-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999;
        display: none;
      }
      .nav-overlay.active {
        display: block;
      }
      .nav-btn {
        width: 100%;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--brand-color);
        padding: clamp(8px, 2.5vw, 10px);
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 8px;
        font-family: inherit;
        font-weight: 600;
        text-align: right;
        font-size: clamp(0.85rem, 2.5vw, 0.95rem);
        transition: var(--transition);
      }
      .nav-btn.active {
        background: var(--brand-color);
        color: white;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: clamp(5px, 2vw, 10px) clamp(10px, 3vw, 15px)
          clamp(30px, 8vh, 50px);
        width: 100%;
        overflow-x: hidden;
      }
      .menu-section {
        display: none;
      }
      .menu-section.active {
        display: block;
        animation: fadeIn 0.5s ease;
      }
      .section-title {
        text-align: center;
        margin: clamp(15px, 4vw, 20px) 0 clamp(20px, 5vw, 25px);
      }
      .section-title h2 {
        font-size: clamp(1.2rem, 4.5vw, 1.8rem);
        border-bottom: 3px solid var(--brand-color);
        display: inline-block;
        padding-bottom: 5px;
      }

      .product-grid {
        display: grid;
        gap: clamp(10px, 2.5vw, 15px);
        grid-template-columns: repeat(2, 1fr);
        width: 100%;
      }

      @media (min-width: 500px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
      }

      @media (min-width: 768px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
      }

      @media (min-width: 1280px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
      }

      .product-card {
        background: var(--card-bg);
        border-radius: clamp(10px, 2.5vw, 12px);
        overflow: hidden;
        aspect-ratio: 3/4;
        position: relative;
        cursor: pointer;
        opacity: 0;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
      }

      .reveal-right {
        transform: translateX(60px);
      }
      .reveal-left {
        transform: translateX(-60px);
      }
      .product-card.active {
        opacity: 1 !important;
        transform: translateX(0) !important;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px var(--shadow);
      }
      .product-card:active {
        transform: scale(0.98);
      }

      .product-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s;
      }
      .product-card:hover img {
        transform: scale(1.08);
      }
      .card-overlay {
        position: absolute;
        bottom: 0;
        inset: 0;
        padding: clamp(10px, 2.5vw, 12px);
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .card-overlay h3 {
        font-size: clamp(0.85rem, 2.8vw, 1.1rem);
        margin-bottom: 5px;
        line-height: 1.3;
      }
      .product-price {
        color: var(--brand-color);
        font-weight: 800;
        font-size: clamp(1rem, 3.2vw, 1.4rem);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: clamp(10px, 3vw, 15px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: var(--card-bg);
        border-radius: clamp(15px, 4vw, 20px);
        width: 100%;
        max-width: min(500px, 95vw);
        overflow: hidden;
        animation: scaleUp 0.3s ease;
        max-height: 90vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        margin: auto;
      }
      .modal-image {
        width: 100%;
        height: clamp(200px, 35vw, 300px);
        object-fit: cover;
      }
      .modal-body {
        padding: clamp(15px, 4vw, 20px);
        text-align: center;
      }

      .close-btn {
        float: left;
        background: none;
        border: none;
        color: white;
        font-size: 1.8rem;
        cursor: pointer;
        padding: 5px 10px;
        line-height: 1;
      }

      .close-btn:hover {
        color: var(--brand-color);
      }

      .modal-title {
        font-size: clamp(1.2rem, 4vw, 1.5rem);
        margin-bottom: 10px;
        clear: both;
      }

      .modal-desc {
        color: var(--text-secondary);
        margin: 10px 0;
        font-size: clamp(0.85rem, 2.5vw, 1rem);
        line-height: 1.6;
      }

      .modal-price {
        font-size: clamp(1.4rem, 4.5vw, 1.8rem);
        color: var(--brand-color);
        font-weight: 800;
        margin: 15px 0;
      }

      @media (max-width: 360px) {
        .burger-text {
          display: none;
        }
      }

      @media (max-width: 480px) {
        .burger-text {
          display: none;
        }
      }

      @media (min-width: 1024px) {
        .burger-text {
          display: inline;
        }
      }

      @media (min-width: 1440px) {
        .container {
          max-width: 1400px;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scaleUp {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      ::-webkit-scrollbar {
        width: clamp(6px, 1.5vw, 8px);
      }
      ::-webkit-scrollbar-track {
        background: var(--dark-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--brand-color);
        border-radius: 4px;
      }

      @media (hover: none) {
        .product-card:active {
          transform: scale(0.98);
        }
      }
    </style>
  </head>

      function init() {
        const navBtns = document.getElementById("navButtons");
        const container = document.getElementById("menuContainer");

        Object.keys(menuData).forEach((key, idx) => {
          const btn = document.createElement("button");
          btn.className = `nav-btn ${idx === 0 ? "active" : ""}`;
          btn.textContent = menuData[key].title;
          btn.onclick = () => showSection(key);
          navBtns.appendChild(btn);

          const s = document.createElement("section");
          s.id = key;
          s.className = `menu-section ${idx === 0 ? "active" : ""}`;
          s.innerHTML = `<div class="section-title"><h2>${menuData[key].title}</h2></div>`;

          const grid = document.createElement("div");
          grid.className = "product-grid";

          menuData[key].items.forEach((item, index) => {
            if (item.active === false) return;

            const card = document.createElement("div");
            const sideClass = index % 2 === 0 ? "reveal-right" : "reveal-left";
            card.className = `product-card ${sideClass}`;

            const displayPrice = item.pricePerKg
              ? `${item.pricePerKg} ₪/كغ`
              : `${item.price} ₪`;

            card.innerHTML = `
              <img src="${item.image}" onerror="this.src='https://via.placeholder.com/400x600?text=صورة+غير+متوفرة'">
              <div class="card-overlay">
                <h3>${item.name}</h3>
                <div class="product-price">${displayPrice}</div>
              </div>
            `;
            card.onclick = () => openModal(item, menuData[key].byWeight);
            grid.appendChild(card);
          });

          s.appendChild(grid);
          container.appendChild(s);
        });

        setTimeout(revealProducts, 100);
      }

      function showSection(id) {
        document
          .querySelectorAll(".menu-section, .nav-btn")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        if (event && event.target) event.target.classList.add("active");
        toggleNav();
      }

      function toggleNav() {
        document.getElementById("navSidebar").classList.toggle("active");
        document.getElementById("navOverlay").classList.toggle("active");
        document.getElementById("burgerMenu").classList.toggle("active");
      }

      function openModal(item, isByWeight) {
        document.getElementById("modalTitle").textContent = item.name;
        document.getElementById("modalDesc").textContent = item.desc || "";
        document.getElementById("modalImage").src = item.image;

        const displayPrice = isByWeight
          ? `${item.pricePerKg} ₪/كغ`
          : `${item.price} ₪`;
        document.getElementById("modalPrice").textContent = displayPrice;

        document.getElementById("productModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("productModal").classList.remove("active");
      }

      function revealProducts() {
        const observer = new IntersectionObserver(
          (entries) =>
            entries.forEach((entry) => {
              if (entry.isIntersecting) entry.target.classList.add("active");
            }),
          { threshold: 0.1 },
        );
        document
          .querySelectorAll(".product-card")
          .forEach((card) => observer.observe(card));
      }

      // Event Listeners
      document.getElementById("burgerMenu").onclick = toggleNav;
      document.getElementById("navOverlay").onclick = toggleNav;

      // Close modal when clicking outside
      document.getElementById("productModal").onclick = function (e) {
        if (e.target === this) closeModal();
      };

      init();
    </script>
