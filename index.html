      :root {
        --brand-color: #e20004;
        --dark-bg: #0a0a0a;
        --card-bg: #1a1a1a;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --shadow: rgba(226, 0, 4, 0.3);
        --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a1a 100%);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
      }

      header {
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: clamp(0.75rem, 2vw, 1rem) 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(226, 0, 4, 0.2);
      }

      .header-content {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 clamp(10px, 3vw, 15px);
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        text-align: center;
      }

      .logo-red {
        color: var(--brand-color);
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 800;
      }

      .logo-red sub {
        font-size: 1.2rem;
        font-weight: 800;
      }

      .back-btn {
        position: fixed;
        top: 80px;
        right: 20px;
        background: var(--brand-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        font-family: inherit;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        z-index: 100;
        display: none;
        transition: var(--transition);
        box-shadow: 0 4px 15px var(--shadow);
      }

      .back-btn:hover {
        transform: scale(1.05);
      }

      .back-btn.visible {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Categories Carousel Section */
      .categories-section {
        min-height: calc(100vh - 70px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      .categories-section.hidden {
        display: none;
      }

      .orbit-container {
        position: relative;
        width: min(550px, 95vw);
        height: min(550px, 95vw);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .center-circle {
        width: clamp(90px, 22vw, 130px);
        height: clamp(90px, 22vw, 130px);
        background: linear-gradient(145deg, var(--brand-color), #a00003);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        box-shadow:
          0 0 60px var(--shadow),
          inset 0 0 30px rgba(0, 0, 0, 0.3);
        z-index: 10;
        animation: pulse 2s ease-in-out infinite;
      }

      .center-circle h2 {
        font-size: clamp(0.9rem, 3.5vw, 1.3rem);
        font-weight: 800;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .center-circle span {
        font-size: clamp(1.3rem, 5vw, 2rem);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .orbit-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px dashed rgba(226, 0, 4, 0.3);
        border-radius: 50%;
        animation: rotate 60s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .categories-orbit {
        position: absolute;
        width: 100%;
        height: 100%;
        animation: orbit 40s linear infinite;
      }

      .categories-orbit.paused {
        animation-play-state: paused;
      }

      @keyframes orbit {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .category-item {
        position: absolute;
        width: clamp(75px, 19vw, 110px);
        height: clamp(75px, 19vw, 110px);
        background: linear-gradient(145deg, var(--card-bg), #252525);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        cursor: pointer;
        transition: var(--transition);
        border: 3px solid transparent;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        text-align: center;
        overflow: hidden;
        padding: 0;
      }

      .category-item:hover {
        border-color: var(--brand-color);
        transform: scale(1.2) !important;
        box-shadow: 0 10px 40px var(--shadow);
      }

      .category-item img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        top: 0;
        left: 0;
        transition: var(--transition);
      }

      .category-item:hover img {
        transform: scale(1.1);
      }

      .category-item .category-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        padding: 8px 5px 6px;
        z-index: 2;
      }

      .category-item p {
        font-size: clamp(0.55rem, 2.2vw, 0.75rem);
        font-weight: 700;
        line-height: 1.2;
        color: var(--text-primary);
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      }

      /* Products Section */
      .products-section {
        display: none;
        padding: 20px;
        padding-top: 80px;
        min-height: calc(100vh - 70px);
      }

      .products-section.visible {
        display: block;
        animation: fadeIn 0.5s ease;
      }

      .section-title {
        text-align: center;
        margin: 20px 0 30px;
      }

      .section-title h2 {
        font-size: clamp(1.4rem, 5vw, 2rem);
        border-bottom: 3px solid var(--brand-color);
        display: inline-block;
        padding-bottom: 8px;
      }

      .product-grid {
        display: grid;
        gap: clamp(10px, 2.5vw, 15px);
        grid-template-columns: repeat(2, 1fr);
        max-width: 1200px;
        margin: 0 auto;
      }

      @media (min-width: 500px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
      }
      @media (min-width: 768px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
      }
      @media (min-width: 1024px) {
        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
      }

      .product-card {
        background: var(--card-bg);
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 3/4;
        position: relative;
        cursor: pointer;
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.5s ease;
      }

      .product-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px var(--shadow);
      }

      .product-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s;
      }

      .product-card:hover img {
        transform: scale(1.08);
      }

      .card-overlay {
        position: absolute;
        bottom: 0;
        inset: 0;
        padding: clamp(10px, 2.5vw, 12px);
        background: linear-gradient(transparent 40%, rgba(0, 0, 0, 0.9));
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .card-overlay h3 {
        font-size: clamp(0.85rem, 2.8vw, 1.1rem);
        margin-bottom: 5px;
        line-height: 1.3;
      }

      .product-price {
        color: var(--brand-color);
        font-weight: 800;
        font-size: clamp(1rem, 3.2vw, 1.4rem);
      }

      /* Modal */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: var(--card-bg);
        border-radius: 20px;
        width: 100%;
        max-width: min(500px, 95vw);
        overflow: hidden;
        animation: scaleUp 0.3s ease;
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-image {
        width: 100%;
        height: clamp(200px, 35vw, 300px);
        object-fit: cover;
      }

      .modal-body {
        padding: 20px;
        text-align: center;
      }

      .close-btn {
        float: left;
        background: none;
        border: none;
        color: white;
        font-size: 1.8rem;
        cursor: pointer;
        padding: 5px 10px;
        line-height: 1;
      }

      .close-btn:hover {
        color: var(--brand-color);
      }

      .modal-title {
        font-size: clamp(1.2rem, 4vw, 1.5rem);
        margin-bottom: 10px;
        clear: both;
      }

      .modal-desc {
        color: var(--text-secondary);
        margin: 10px 0;
        font-size: clamp(0.85rem, 2.5vw, 1rem);
      }

      .modal-price {
        font-size: clamp(1.4rem, 4.5vw, 1.8rem);
        color: var(--brand-color);
        font-weight: 800;
        margin: 15px 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes scaleUp {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--dark-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--brand-color);
        border-radius: 4px;
      }

      /* Floating particles */
      .particle {
        position: fixed;
        width: 4px;
        height: 4px;
        background: var(--brand-color);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.3;
        animation: float 10s infinite ease-in-out;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0);
        }
        25% {
          transform: translateY(-20px) translateX(10px);
        }
        50% {
          transform: translateY(-10px) translateX(-10px);
        }
        75% {
          transform: translateY(-30px) translateX(5px);
        }
      }

      @keyframes counterRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(-360deg);
        }
      }
    </style>
  </head>

      let currentCategory = null;

      function init() {
        createOrbit();
        createParticles();
      }

      function createOrbit() {
        const orbit = document.getElementById("orbit");
        const categories = Object.keys(menuData);
        const total = categories.length;
        const radius = Math.min(window.innerWidth * 0.38, 210);

        categories.forEach((key, index) => {
          const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;

          const itemSize = Math.min(window.innerWidth * 0.095, 55);

          const item = document.createElement("div");
          item.className = "category-item";
          item.style.left = `calc(50% + ${x}px - ${itemSize}px)`;
          item.style.top = `calc(50% + ${y}px - ${itemSize}px)`;
          item.style.animation = `counterRotate 40s linear infinite`;

          const categoryData = menuData[key];

          item.innerHTML = `
            <img src="${categoryData.categoryImage}" alt="${categoryData.title}" onerror="this.style.display='none'">
            <div class="category-overlay">
              <p>${categoryData.title}</p>
            </div>
          `;
          item.onclick = () => showProducts(key);

          orbit.appendChild(item);
        });
      }

      function createParticles() {
        for (let i = 0; i < 15; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";
          particle.style.left = Math.random() * 100 + "%";
          particle.style.top = Math.random() * 100 + "%";
          particle.style.animationDelay = Math.random() * 5 + "s";
          particle.style.animationDuration = 8 + Math.random() * 4 + "s";
          document.body.appendChild(particle);
        }
      }

      function showProducts(categoryKey) {
        currentCategory = categoryKey;
        const category = menuData[categoryKey];

        document.getElementById("categoriesSection").classList.add("hidden");
        document.getElementById("productsSection").classList.add("visible");
        document.getElementById("backBtn").classList.add("visible");
        document.getElementById("sectionTitle").textContent = category.title;

        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        category.items.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "product-card";

          const displayPrice = item.pricePerKg
            ? `${item.pricePerKg} ₪/كغ`
            : `${item.price} ₪`;
          const placeholder = `https://via.placeholder.com/400x500/1a1a1a/e20004?text=${encodeURIComponent(item.name)}`;

          card.innerHTML = `
            <img src="${item.image || placeholder}" onerror="this.src='${placeholder}'">
            <div class="card-overlay">
              <h3>${item.name}</h3>
              <div class="product-price">${displayPrice}</div>
            </div>
          `;
          card.onclick = () => openModal(item, category.byWeight);
          grid.appendChild(card);

          setTimeout(() => card.classList.add("visible"), index * 50);
        });

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function showCategories() {
        document.getElementById("categoriesSection").classList.remove("hidden");
        document.getElementById("productsSection").classList.remove("visible");
        document.getElementById("backBtn").classList.remove("visible");
        currentCategory = null;
      }

      function openModal(item, isByWeight) {
        document.getElementById("modalTitle").textContent = item.name;
        document.getElementById("modalDesc").textContent = item.desc || "";
        const placeholder = `https://via.placeholder.com/500x300/1a1a1a/e20004?text=${encodeURIComponent(item.name)}`;
        document.getElementById("modalImage").src = item.image || placeholder;

        const displayPrice = isByWeight
          ? `${item.pricePerKg} ₪/كغ`
          : `${item.price} ₪`;
        document.getElementById("modalPrice").textContent = displayPrice;

        document.getElementById("productModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("productModal").classList.remove("active");
      }

      document.getElementById("productModal").onclick = function (e) {
        if (e.target === this) closeModal();
      };

      // Pause orbit on hover
      document.getElementById("orbit").addEventListener("mouseenter", () => {
        document.getElementById("orbit").classList.add("paused");
      });
      document.getElementById("orbit").addEventListener("mouseleave", () => {
        document.getElementById("orbit").classList.remove("paused");
      });

      init();
    </script>
